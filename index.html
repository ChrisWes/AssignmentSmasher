<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assignment Smasher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f2fb; --surface:#ffffff; --surface2:#ebe7f8; --text:#1c1533; --muted:#5d5680;
  --line:#d8d1ee; --accent:#2f8f5b; --accent-ink:#eafff3; --warn:#b8380c; --warn-bg:#fff1ec;
  --link:#4a2fc2; --info:#1d5fd6; --info-bg:#e8f0ff; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#16112a; --surface:#1f1839; --surface2:#2a2150; --text:#f1edfc; --muted:#a9a1cc;
    --line:#372e62; --accent:#4bd18a; --accent-ink:#08160f; --warn:#ff8a6a; --warn-bg:#3a1c14;
    --link:#b7a6ff; --info:#7ab3ff; --info-bg:#182c4d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.55 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 64px; }
a { color: var(--link); }
h1, h2, h3 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
header.top h1 { font-size: clamp(30px, 6vw, 40px); }
.btn {
  font: 600 15px/1 'Barlow', sans-serif; border-radius: 10px; padding: 12px 18px; min-height: 44px;
  cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--text);
}
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-quiet { background: none; border-color: transparent; padding: 10px 4px; }
.btn-warn { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn-warn-outline { background: none; border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .55; cursor: default; }
.header-actions { display: flex; align-items: center; gap: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.project-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer; text-align: left; font: inherit; color: inherit;
}
.project-row:hover { border-color: var(--accent); }
.project-row .meta { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.badge { font: 600 12px/1 'Barlow', sans-serif; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.badge-draft, .badge-analyzing { background: var(--surface2); color: var(--muted); }
.badge-outline { background: var(--accent-ink); color: var(--accent); }
.badge-failed { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
.row-badges { display: flex; align-items: center; gap: 8px; flex: none; }
.progress-badge.compact { font-size: 12px; padding: 4px 9px; }

.admin-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.admin-row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.admin-row-main { min-width: 0; }
.admin-row .meta { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.admin-confirm { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.admin-confirm label { margin: 0 0 8px; font-weight: 400; color: var(--muted); font-size: 14px; }
.admin-confirm-row { display: flex; gap: 10px; flex-wrap: wrap; }
.admin-confirm-row input { flex: 1 1 160px; min-width: 0; }

label { display: block; font-weight: 600; margin: 16px 0 6px; }
label:first-child { margin-top: 0; }
.hint { display: block; font-weight: 400; font-size: 14px; color: var(--muted); margin-top: 2px; }
input[type="text"], input[type="date"], input[type="number"], textarea {
  width: 100%; padding: 11px 12px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; font: 400 16px/1.4 'Barlow', sans-serif; min-height: 44px;
}
textarea { min-height: 60px; resize: vertical; }
input[type="file"] { width: 100%; padding: 8px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.form-actions { display: flex; gap: 12px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
.error-banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-weight: 500; }
.progress { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 20px 0; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.section-title { font-size: 22px; margin: 26px 0 10px; }
.section-title:first-of-type { margin-top: 4px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 10px 0; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: none; }
.deliverable .fmt { color: var(--muted); font-size: 14px; }
.criterion { display: flex; justify-content: space-between; gap: 12px; }
.criterion .weight { color: var(--muted); white-space: nowrap; }
.ambiguity-list { background: var(--surface2); border-radius: 10px; padding: 14px 16px; }
.ambiguity-list li { border-bottom: 1px solid var(--line); }
.ambiguity-list li:last-child { border-bottom: none; }
.none-note { color: var(--muted); font-style: italic; }

.schedule-summary {
  display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 16px;
  margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
}
.overcommit-warning { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; margin: 14px 0 0; font-weight: 600; }

.milestone { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.milestone.is-done { border-color: var(--accent); background: var(--accent-ink); }
.milestone .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row1-left { display: flex; align-items: center; gap: 14px; }
.milestone .num { font: 700 15px/1 'Barlow Condensed', sans-serif; color: var(--muted); }
.milestone .target { font-size: 14px; color: var(--muted); white-space: nowrap; }
.milestone-done { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.milestone-done input { width: 16px; height: 16px; cursor: pointer; }
.milestone label { margin: 10px 0 4px; font-size: 14px; }
.milestone .dur-row { display: flex; align-items: center; gap: 10px; }
.milestone .dur-row input { width: 90px; }

.progress-widget {
  margin: 2px 0 26px; background: var(--surface); border: 2px solid var(--info);
  border-radius: 16px; padding: 22px 24px; box-shadow: 0 2px 14px rgba(29,95,214,.08);
}
.progress-headline { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.progress-badge { font: 700 28px/1 'Barlow Condensed', sans-serif; padding: 10px 20px; border-radius: 999px; white-space: nowrap; }
.progress-badge.ahead { background: var(--accent-ink); color: var(--accent); }
.progress-badge.behind { background: var(--warn-bg); color: var(--warn); }
.progress-badge.on-track { background: var(--surface2); color: var(--muted); }
.progress-badge.due { background: var(--info-bg); color: var(--info); }
.progress-meta { margin: 0 0 18px; font-size: 16px; color: var(--muted); }
.progress-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.progress-row:last-of-type { margin-bottom: 0; }
.progress-label { flex: none; width: 170px; font-size: 17px; font-weight: 700; color: var(--info); }
.progress-track {
  flex: 1; min-width: 0; height: 32px; border-radius: 16px; background: var(--surface2);
  border: 1px solid var(--info); position: relative; overflow: hidden;
}
.progress-fill { position: absolute; inset: 0 auto 0 0; height: 100%; border-radius: 16px 0 0 16px; transition: width .3s ease; }
.progress-fill.expected { background: var(--muted); opacity: .45; }
.progress-fill.actual.ahead, .progress-fill.actual.on-track { background: var(--accent); }
.progress-fill.actual.behind { background: var(--warn); }
.progress-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--bg); opacity: .7; }
.steps-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.steps-section .hint { display: inline-block; margin: 8px 0 0; }
.steps-toggle {
  background: none; border: 0; padding: 4px 0; min-height: 32px; cursor: pointer;
  color: var(--link); font: 600 14px/1 'Barlow', sans-serif;
}
.steps-list { margin: 10px 0; padding-left: 22px; }
.steps-list li { margin-bottom: 8px; font-size: 14.5px; line-height: 1.5; }
.steps-list li::marker { color: var(--accent); font-weight: 700; }
.steps-list li.step-row { padding: 3px 0; border-bottom: none; margin-bottom: 0; }
.step-check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14.5px; line-height: 1.5; padding: 4px 0; }
.step-check input { margin-top: 3px; width: 16px; height: 16px; flex: none; cursor: pointer; }
.step-row.is-done .step-check span { color: var(--muted); text-decoration: line-through; }
.steps-all-done { margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.submission-upload { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.submission-upload input[type="file"] { flex: 1 1 220px; min-width: 0; }

.band {
  display: inline-block; font: 700 12px/1 'Barlow', sans-serif; letter-spacing: .02em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; white-space: nowrap;
}
.band-needs_work { background: var(--warn-bg); color: var(--warn); }
.band-on_track { background: var(--surface2); color: var(--muted); }
.band-strong { background: var(--accent-ink); color: var(--accent); }
.band-excellent { background: var(--accent); color: var(--accent-ink); }

.feedback-result { margin-top: 18px; }
.fb-overall { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 18px; }
.fb-overall p { margin: 0; max-width: 42em; }
.fb-subtitle { font-size: 17px; margin: 20px 0 8px; }

.check-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.check-row:last-child { border-bottom: none; }
.check-icon {
  flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font: 700 13px/1 'Barlow', sans-serif; margin-top: 1px;
}
.check-yes .check-icon { background: var(--accent-ink); color: var(--accent); }
.check-no .check-icon { background: var(--warn-bg); color: var(--warn); }
.check-unclear .check-icon { background: var(--surface2); color: var(--muted); }
.check-row .meta { display: block; margin-top: 2px; }

.fb-criterion { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.fb-criterion-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.fb-list { margin: 0 0 6px; padding-left: 20px; }
.fb-list li { margin-bottom: 4px; font-size: 14.5px; line-height: 1.5; }
.fb-strength::marker { color: var(--accent); content: '+ '; }
.fb-gap::marker { color: var(--warn); content: '\2212 '; }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 20;
  background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 999px;
  font: 600 15px/1.2 'Barlow', sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.28); max-width: calc(100vw - 32px); text-align: center;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--warn); color: #fff; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var MAX_FILE_BYTES = 8 * 1024 * 1024; // mirrors functions/api/projects/index.js — checked here
                                          // too so an oversized file never starts uploading at all
  var app = document.getElementById('app');
  var state = {
    view: 'dashboard', projects: [], detail: null, loading: false, formError: null, saving: false,
    email: null, isAdmin: false, adminProjects: [], adminTotals: null, adminConfirmId: null, expandedSteps: {}
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var toastTimer = null;
  function toast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }

  function todayISO() { return new Date().toISOString().slice(0, 10); }

  // Dates are stored and sent as ISO (yyyy-mm-dd) throughout — needed for <input type="date">,
  // for sorting, and for the date arithmetic elsewhere in this file. This only reformats a date
  // for on-screen text, UK-style (dd-mm-yyyy); never use it on a value an input or the API expects.
  function formatDateUK(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    var parts = iso.split('-');
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }

  async function api(path, options) {
    var res;
    try {
      res = await fetch(path, options);
    } catch (e) {
      // fetch() itself rejects (always a TypeError) when the request never got a response at all —
      // a dropped connection, a timeout, or similar — as opposed to the server answering with an
      // error, which is handled below. Browsers word this differently ("Load failed" in Safari,
      // "Failed to fetch" in Chrome); show one clear message instead of either raw browser string.
      throw new Error('The connection dropped before this finished. Check your network and try again.');
    }
    var data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      var msg = (data && data.error) ? data.error : ('Request failed (' + res.status + ')');
      throw new Error(msg);
    }
    return data;
  }

  // Mirrors functions/lib/dates.js — client-side only for live feedback while editing;
  // the server recomputes authoritatively on save.
  function computeScheduleLocal(startDate, endDate, milestones) {
    var BUFFER = 3;
    var start = new Date(startDate + 'T00:00:00Z');
    var end = new Date(endDate + 'T00:00:00Z');
    var totalDays = Math.round((end - start) / 86400000);
    var usableDays = Math.max(totalDays - BUFFER, 0);
    var cursor = 0;
    var scheduled = milestones.map(function (m) {
      cursor += Number(m.duration_days) || 0;
      var d = new Date(start.getTime() + cursor * 86400000);
      return Object.assign({}, m, { target_date: d.toISOString().slice(0, 10) });
    });
    var needed = milestones.reduce(function (s, m) { return s + (Number(m.duration_days) || 0); }, 0);
    return { milestones: scheduled, total_days: totalDays, needed_days: needed, usable_days: usableDays, buffer_days: BUFFER, overcommitted: needed > usableDays };
  }

  // Expected pace vs actual: "expected" is how many of the plan's days should have been used up
  // by today, going purely by the milestone schedule (so it tops out at needed_days, not the full
  // calendar span — the buffer at the end is slack, not assigned to any milestone). "Actual" is the
  // sum of duration_days for milestones ticked done. The difference is a genuine day count, not a
  // milestone count, so milestones of very different sizes don't distort it.
  function computeProgress(startDate, milestonesWithTargetDates, neededDays) {
    var start = new Date(startDate + 'T00:00:00Z');
    var todayIso = new Date().toISOString().slice(0, 10);
    var todayUtc = new Date(todayIso + 'T00:00:00Z');
    var daysElapsed = Math.round((todayUtc - start) / 86400000);
    var expectedDays = Math.max(0, Math.min(daysElapsed, neededDays));
    var actualDays = milestonesWithTargetDates.reduce(function (s, m) { return s + (m.done ? (Number(m.duration_days) || 0) : 0); }, 0);
    return {
      today: todayIso,
      expected_days: expectedDays,
      actual_days: actualDays,
      ahead_behind_days: actualDays - expectedDays,
      expected_pct: neededDays ? Math.min(100, Math.round(expectedDays / neededDays * 100)) : 0,
      actual_pct: neededDays ? Math.min(100, Math.round(actualDays / neededDays * 100)) : 0,
      done_count: milestonesWithTargetDates.filter(function (m) { return m.done; }).length,
      expected_count: milestonesWithTargetDates.filter(function (m) { return m.target_date <= todayIso; }).length,
      total_count: milestonesWithTargetDates.length
    };
  }

  function render() {
    if (state.view === 'dashboard') return renderDashboard();
    if (state.view === 'new') return renderNewProject();
    if (state.view === 'detail') return renderDetail();
    if (state.view === 'admin') return renderAdmin();
  }

  // ---- Dashboard ----

  function compactProgressBadge(p) {
    if (!p) return '';
    var n = Math.abs(p.ahead_behind_days);
    var cls = p.ahead_behind_days > 0 ? 'ahead' : p.ahead_behind_days < 0 ? 'behind' : 'on-track';
    var label = p.ahead_behind_days > 0 ? n + 'd ahead' : p.ahead_behind_days < 0 ? n + 'd behind' : 'On schedule';
    return '<span class="progress-badge compact ' + cls + '">' + esc(label) + '</span>';
  }

  function renderDashboard() {
    var rows = state.projects.map(function (p) {
      return '<button type="button" class="project-row" data-open="' + esc(p.id) + '">' +
        '<span><strong>' + esc(p.title) + '</strong>' +
        '<span class="meta">' + esc(p.subject || 'No subject given') + ' · due ' + esc(formatDateUK(p.end_date)) + '</span></span>' +
        '<span class="row-badges">' + compactProgressBadge(p.progress) +
        '<span class="badge badge-' + esc(p.status) + '">' + esc(statusLabel(p.status)) + '</span></span>' +
      '</button>';
    }).join('');

    app.innerHTML =
      '<header class="top"><h1>Assignment Smasher</h1>' +
      '<span class="header-actions">' +
        (state.isAdmin ? '<button type="button" class="btn btn-quiet" id="adminBtn">Admin</button>' : '') +
        '<button type="button" class="btn btn-accent" id="newBtn">+ New project</button>' +
      '</span></header>' +
      (state.email ? '<p class="meta" style="margin:-14px 0 18px;">Signed in as ' + esc(state.email) + '</p>' : '') +
      (state.projects.length ? rows : '<p class="empty">No projects yet. Upload a brief to get started.</p>');

    document.getElementById('newBtn').addEventListener('click', function () {
      state.view = 'new'; state.formError = null; render();
    });
    var adminBtn = document.getElementById('adminBtn');
    if (adminBtn) adminBtn.addEventListener('click', loadAdmin);
    app.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () { openProject(btn.getAttribute('data-open')); });
    });
  }

  function statusLabel(s) {
    return s === 'draft' ? 'Not analysed' : s === 'analyzing' ? 'Reading brief…' : s === 'outline' ? 'Plan ready' : s === 'failed' ? 'Analysis failed' : s;
  }

  async function loadDashboard() {
    state.view = 'dashboard';
    try {
      var data = await api('/api/projects');
      state.projects = data.projects || [];
    } catch (e) {
      state.projects = [];
      toast(e.message, true);
    }
    render();
  }

  function loadEmail() {
    api('/api/me').then(function (data) {
      state.email = data && data.email ? data.email : null;
      state.isAdmin = !!(data && data.isAdmin);
      if (state.view === 'dashboard') render();
    }).catch(function () { /* not shown if it fails — the rest of the app still works */ });
  }

  // ---- Admin ----

  async function loadAdmin() {
    state.view = 'admin';
    state.adminConfirmId = null;
    try {
      var data = await api('/api/admin/projects');
      state.adminProjects = data.projects || [];
      state.adminTotals = data.totals || null;
    } catch (e) {
      state.adminProjects = [];
      state.adminTotals = null;
      toast(e.message, true);
    }
    render();
  }

  function renderAdmin() {
    var count = state.adminProjects.length;
    var rows = state.adminProjects.map(function (p) {
      var confirming = state.adminConfirmId === p.id;
      var calls = p.ai_calls || 0;
      return '<div class="admin-row" data-id="' + esc(p.id) + '">' +
        '<div class="admin-row-top">' +
          '<div class="admin-row-main">' +
            '<strong>' + esc(p.title) + '</strong>' +
            '<span class="meta">' + esc(p.owner_email) + ' · ' + esc(p.subject || 'No subject given') + ' · due ' + esc(formatDateUK(p.end_date)) + '</span>' +
            '<span class="meta">' + calls + ' AI call' + (calls === 1 ? '' : 's') + ' · ~$' + p.estimated_cost_usd.toFixed(2) + ' estimated</span>' +
          '</div>' +
          '<span class="badge badge-' + esc(p.status) + '">' + esc(statusLabel(p.status)) + '</span>' +
          (confirming ? '' : '<button type="button" class="btn btn-warn-outline delete-btn">Delete</button>') +
        '</div>' +
        (confirming
          ? '<div class="admin-confirm">' +
              '<label>Type <strong>delete</strong> to remove this project and its uploaded files for good.</label>' +
              '<div class="admin-confirm-row">' +
                '<input type="text" class="confirm-input" autocomplete="off" spellcheck="false">' +
                '<button type="button" class="btn btn-warn confirm-delete-btn" disabled>Delete permanently</button>' +
                '<button type="button" class="btn btn-quiet cancel-delete-btn">Cancel</button>' +
              '</div>' +
            '</div>'
          : '') +
      '</div>';
    }).join('');

    var totalsLine = state.adminTotals
      ? '<p class="meta" style="margin:0 0 18px;">' + state.adminTotals.calls + ' AI call' + (state.adminTotals.calls === 1 ? '' : 's') +
        ' across all projects · ~$' + state.adminTotals.estimated_cost_usd.toFixed(2) +
        ' estimated (Opus 5 rates, before any prompt-cache discount, so the real bill will usually be a little lower)</p>'
      : '';

    app.innerHTML =
      '<header class="top"><h1>Admin</h1>' +
      '<button type="button" class="btn btn-quiet" id="backBtn">← Back to dashboard</button></header>' +
      '<p class="meta" style="margin:-14px 0 6px;">' + count + ' project' + (count === 1 ? '' : 's') + ' across every account.</p>' +
      totalsLine +
      (count ? rows : '<p class="empty">No projects yet.</p>');

    wireBack();

    app.querySelectorAll('.delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.adminConfirmId = btn.closest('.admin-row').getAttribute('data-id');
        renderAdmin();
        var input = app.querySelector('.confirm-input');
        if (input) input.focus();
      });
    });
    app.querySelectorAll('.cancel-delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { state.adminConfirmId = null; renderAdmin(); });
    });
    app.querySelectorAll('.admin-row').forEach(function (rowEl) {
      var input = rowEl.querySelector('.confirm-input');
      var confirmBtn = rowEl.querySelector('.confirm-delete-btn');
      if (!input || !confirmBtn) return;
      input.addEventListener('input', function () {
        confirmBtn.disabled = input.value.trim().toLowerCase() !== 'delete';
      });
      confirmBtn.addEventListener('click', function () {
        deleteProjectAsAdmin(rowEl.getAttribute('data-id'), confirmBtn);
      });
    });
  }

  async function deleteProjectAsAdmin(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
      await api('/api/admin/projects/' + encodeURIComponent(id), { method: 'DELETE' });
      state.adminProjects = state.adminProjects.filter(function (p) { return p.id !== id; });
      state.adminConfirmId = null;
      toast('Project deleted.');
      renderAdmin();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = 'Delete permanently';
    }
  }

  // ---- New project ----

  // Errors during submission are shown by patching this one existing form in place (see
  // showFormError below), never by rebuilding it — rebuilding via innerHTML would otherwise wipe
  // out everything typed, and the chosen file along with it, every time something went wrong.
  // This function only ever runs once per visit to the "new project" screen.
  function renderNewProject() {
    app.innerHTML =
      '<header class="top"><h1>New project</h1>' +
      '<button type="button" class="btn btn-quiet" id="backBtn">← Back</button></header>' +
      '<form class="card" id="newForm" novalidate>' +
        '<label for="f-title">Title<span class="hint">Whatever you’ll recognise it by — the module name is fine.</span></label>' +
        '<input type="text" id="f-title" name="title" maxlength="200" required>' +
        '<label for="f-subject">Subject<span class="hint">Optional, but it helps Claude read the brief in context.</span></label>' +
        '<input type="text" id="f-subject" name="subject" maxlength="200">' +
        '<div class="grid2">' +
          '<div><label for="f-start">Start date</label><input type="date" id="f-start" name="start_date" required></div>' +
          '<div><label for="f-end">Deadline</label><input type="date" id="f-end" name="end_date" required></div>' +
        '</div>' +
        '<label for="f-brief">Assignment brief (PDF)<span class="hint">Up to 8MB.</span></label>' +
        '<input type="file" id="f-brief" name="brief" accept="application/pdf" required>' +
        '<label for="f-rubric">Marking rubric (PDF, optional)<span class="hint">If it’s a separate document from the brief.</span></label>' +
        '<input type="file" id="f-rubric" name="rubric" accept="application/pdf">' +
        '<div class="form-actions">' +
          '<button type="submit" class="btn btn-accent" id="submitBtn">Create and read the brief</button>' +
        '</div>' +
      '</form>';

    document.getElementById('f-start').value = todayISO();
    document.getElementById('backBtn').addEventListener('click', loadDashboard);
    document.getElementById('newForm').addEventListener('submit', handleCreate);
  }

  // Shows or clears an error banner by patching the existing form in place — never by rebuilding
  // it, which would lose whatever was typed and, worse, the chosen file (a file input's value
  // can't be restored by JS at all once lost, unlike a re-typed title).
  function showFormError(message) {
    state.formError = message || null;
    var form = document.getElementById('newForm');
    if (!form) return;
    var existing = form.querySelector('.error-banner');
    if (message) {
      if (existing) { existing.textContent = message; }
      else {
        var p = document.createElement('p');
        p.className = 'error-banner';
        p.textContent = message;
        form.insertBefore(p, form.firstChild);
      }
    } else if (existing) {
      existing.remove();
    }
  }

  async function handleCreate(e) {
    e.preventDefault();
    var form = e.target;
    var submitBtn = document.getElementById('submitBtn');
    showFormError(null);

    var brief = form.brief.files[0];
    if (brief && brief.type !== 'application/pdf') { showFormError('The brief must be a PDF.'); return; }
    if (brief && brief.size > MAX_FILE_BYTES) { showFormError('That brief is larger than 8MB — try a smaller file.'); return; }
    var rubric = form.rubric.files[0];
    if (rubric && rubric.type !== 'application/pdf') { showFormError('The rubric must be a PDF.'); return; }
    if (rubric && rubric.size > MAX_FILE_BYTES) { showFormError('That rubric is larger than 8MB — try a smaller file.'); return; }
    var startDate = form.start_date.value, endDate = form.end_date.value;
    if (startDate && endDate && endDate <= startDate) { showFormError('The deadline needs to be after the start date.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading…';

    try {
      var fd = new FormData(form);
      var created = await api('/api/projects', { method: 'POST', body: fd });
      state.view = 'detail';
      state.detail = { id: created.id, title: created.title, subject: created.subject, start_date: created.start_date, end_date: created.end_date, status: 'analyzing', files: [], outline: null };
      render();
      await runAnalyze(created.id);
    } catch (err) {
      // Nothing about the form is touched here — the title, subject, dates and the chosen file
      // are all exactly as she left them, so trying again is just one more click, not a re-fill.
      showFormError(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create and read the brief';
    }
  }

  // ---- Project detail ----

  async function openProject(id) {
    state.view = 'detail';
    state.detail = null;
    render();
    await loadDetail(id);
  }

  async function loadDetail(id) {
    try {
      state.detail = await api('/api/projects/' + encodeURIComponent(id));
    } catch (e) {
      toast(e.message, true);
      loadDashboard();
      return;
    }
    render();
  }

  async function runAnalyze(id) {
    try {
      await api('/api/projects/' + encodeURIComponent(id) + '/analyze', { method: 'POST' });
    } catch (e) {
      // The error is already saved against the project; fall through to reload its real state.
    }
    await loadDetail(id);
  }

  function renderDetail() {
    var d = state.detail;
    var back = '<button type="button" class="btn btn-quiet" id="backBtn">← All projects</button>';

    if (!d) { app.innerHTML = back + '<div class="progress"><span class="spinner"></span> Loading…</div>'; wireBack(); return; }

    var head = '<header class="top"><h1>' + esc(d.title) + '</h1>' + back + '</header>' +
      '<p class="meta" style="color:var(--muted); margin:-14px 0 18px;">' + esc(d.subject || 'No subject given') +
      ' · ' + esc(formatDateUK(d.start_date)) + ' to ' + esc(formatDateUK(d.end_date)) + '</p>';

    if (d.status === 'draft') {
      app.innerHTML = head + '<div class="card"><p>This brief hasn’t been read yet.</p>' +
        '<button type="button" class="btn btn-accent" id="analyzeBtn">Read the brief</button></div>';
      wireBack();
      document.getElementById('analyzeBtn').addEventListener('click', function () { startAnalyzing(d.id); });
      return;
    }

    if (d.status === 'analyzing') {
      app.innerHTML = head + '<div class="progress"><span class="spinner"></span> Reading the brief and planning it out — this can take a minute.</div>';
      wireBack();
      return;
    }

    if (d.status === 'failed') {
      app.innerHTML = head + '<div class="error-banner">' + esc(d.error || 'Something went wrong.') + '</div>' +
        '<button type="button" class="btn btn-accent" id="retryBtn">Try again</button>';
      wireBack();
      document.getElementById('retryBtn').addEventListener('click', function () { startAnalyzing(d.id); });
      return;
    }

    // outline
    var o = d.outline;
    var deliverables = o.deliverables.map(function (x) {
      return '<li class="deliverable"><strong>' + esc(x.title) + '</strong><br><span class="fmt">' + esc(x.format) + '</span><br>' + esc(x.description) + '</li>';
    }).join('');

    var criteria = o.assessment_criteria.length ? o.assessment_criteria.map(function (c) {
      return '<li class="criterion"><span>' + esc(c.criterion) + '</span>' + (c.weight ? '<span class="weight">' + esc(c.weight) + '</span>' : '') + '</li>';
    }).join('') : '<li class="none-note">No separate criteria found — go by the brief itself.</li>';

    var ambiguities = o.ambiguities.length ? o.ambiguities.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('')
      : '<li class="none-note">Nothing flagged as unclear.</li>';

    var milestones = o.milestones.map(function (m, i) {
      return '<div class="milestone' + (m.done ? ' is-done' : '') + '" data-idx="' + i + '">' +
        '<div class="row1"><span class="row1-left"><span class="num">Milestone ' + (i + 1) + '</span>' +
        '<label class="milestone-done"><input type="checkbox" class="m-done" data-idx="' + i + '"' + (m.done ? ' checked' : '') + '> Done</label></span>' +
        '<span class="target">due around ' + esc(formatDateUK(m.target_date)) + '</span></div>' +
        '<label>Title</label><input type="text" class="m-title" value="' + esc(m.title) + '">' +
        '<label>Goal</label><textarea class="m-goal">' + esc(m.goal) + '</textarea>' +
        '<label>Focused days needed</label>' +
        '<div class="dur-row"><input type="number" class="m-duration" min="1" max="120" value="' + esc(m.duration_days) + '"></div>' +
        stepsSectionHtml(m, i) +
      '</div>';
    }).join('');

    app.innerHTML = head +
      progressWidgetHtml(d) +
      '<h2 class="section-title">Deliverables</h2><ul class="plain">' + deliverables + '</ul>' +
      '<h2 class="section-title">Assessment criteria</h2><ul class="plain">' + criteria + '</ul>' +
      '<h2 class="section-title">Worth checking with your tutor</h2><ul class="plain ambiguity-list">' + ambiguities + '</ul>' +
      '<h2 class="section-title">Milestones</h2>' + milestones +
      '<div class="form-actions"><button type="button" class="btn btn-accent" id="saveBtn">Save changes</button>' +
      '<button type="button" class="btn" id="reanalyzeBtn">Re-read the brief</button></div>' +
      renderFeedbackSection(d);

    wireBack();
    updateScheduleSummary();
    app.querySelectorAll('.m-duration').forEach(function (inp) {
      inp.addEventListener('input', updateScheduleSummary);
    });
    document.getElementById('saveBtn').addEventListener('click', function () { saveOutlineEdits(d.id); });
    document.getElementById('reanalyzeBtn').addEventListener('click', function () { startAnalyzing(d.id); });
    wireMilestoneDoneControls(d.id);
    wireStepsControls(d.id);
    wireFeedbackControls(d.id);
  }

  // ---- Progress: expected pace vs actual, done milestones ----

  function progressWidgetHtml(d) {
    var o = d.outline;
    var neededDays = o.schedule.needed_days;
    var p = computeProgress(d.start_date, o.milestones, neededDays);

    var status = p.ahead_behind_days > 0 ? 'ahead' : p.ahead_behind_days < 0 ? 'behind' : 'on-track';
    var n = Math.abs(p.ahead_behind_days);
    var headline = p.ahead_behind_days > 0 ? n + ' day' + (n === 1 ? '' : 's') + ' ahead of schedule'
      : p.ahead_behind_days < 0 ? n + ' day' + (n === 1 ? '' : 's') + ' behind schedule'
      : 'On schedule';

    var ticks = '';
    var cursor = 0;
    o.milestones.forEach(function (m, i) {
      cursor += Number(m.duration_days) || 0;
      if (i === o.milestones.length - 1) return; // the last boundary is the end of the track itself
      var pct = neededDays ? Math.min(100, cursor / neededDays * 100) : 0;
      ticks += '<span class="progress-tick" style="left:' + pct + '%"></span>';
    });

    return '<div class="progress-widget">' +
      '<div class="progress-headline">' +
        '<span class="progress-badge ' + status + '">' + esc(headline) + '</span>' +
        '<span class="progress-badge due">Assignment required by ' + esc(formatDateUK(d.end_date)) + '</span>' +
      '</div>' +
      '<p class="progress-meta">' + p.done_count + ' of ' + p.total_count + ' milestones done · ' + p.expected_count + ' expected by today</p>' +
      '<div class="progress-row"><span class="progress-label">Expected by today</span>' +
        '<div class="progress-track"><div class="progress-fill expected" style="width:' + p.expected_pct + '%"></div>' + ticks + '</div></div>' +
      '<div class="progress-row"><span class="progress-label">Actual progress</span>' +
        '<div class="progress-track"><div class="progress-fill actual ' + status + '" style="width:' + p.actual_pct + '%"></div>' + ticks + '</div></div>' +
      '<div class="schedule-summary" id="scheduleSummary"></div>' +
      '<div id="overcommitWarning"></div>' +
    '</div>';
  }

  function wireMilestoneDoneControls(id) {
    app.querySelectorAll('.m-done').forEach(function (cb) {
      cb.addEventListener('change', function () {
        toggleMilestoneDone(id, Number(cb.getAttribute('data-idx')), cb.checked, cb);
      });
    });
  }

  async function toggleMilestoneDone(id, idx, done, cb) {
    cb.disabled = true;
    try {
      var data = await api('/api/projects/' + encodeURIComponent(id) + '/milestones/' + idx + '/done', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ done: done })
      });
      state.detail.outline.milestones = data.milestones;
      renderDetail();
    } catch (e) {
      toast(e.message, true);
      cb.checked = !done;
      cb.disabled = false;
    }
  }

  // ---- Per-milestone steps ----

  // A step is either a bare string (generated before step-ticking existed) or { text, done } —
  // normalise on every read so rendering never has to care which it finds.
  function normalizeStep(s) {
    return typeof s === 'string' ? { text: s, done: false } : s;
  }

  function stepsSectionHtml(m, i) {
    var hasSteps = Array.isArray(m.steps) && m.steps.length > 0;
    if (!hasSteps) {
      return '<div class="steps-section">' +
        '<button type="button" class="btn btn-quiet steps-generate-btn" data-idx="' + i + '">Generate step-by-step instructions</button>' +
        '<span class="hint">Turns this milestone into a short checklist, grounded in the brief. Uses whatever’s saved above — save any edits to the title or goal first.</span>' +
      '</div>';
    }
    var steps = m.steps.map(normalizeStep);
    var doneCount = steps.filter(function (s) { return s.done; }).length;
    var expanded = !!state.expandedSteps[i];
    var allDone = doneCount === steps.length;
    var list = expanded
      ? '<ul class="plain steps-list">' + steps.map(function (s, si) {
          return '<li class="step-row' + (s.done ? ' is-done' : '') + '">' +
            '<label class="step-check"><input type="checkbox" class="s-done" data-idx="' + i + '" data-step="' + si + '"' + (s.done ? ' checked' : '') + '> ' +
            '<span>' + esc(s.text) + '</span></label>' +
          '</li>';
        }).join('') + '</ul>' +
        (allDone && !m.done ? '<p class="hint steps-all-done">All steps ticked. <button type="button" class="btn btn-quiet mark-milestone-done-btn" data-idx="' + i + '">Mark the milestone done too</button></p>' : '') +
        '<button type="button" class="btn btn-quiet steps-regenerate-btn" data-idx="' + i + '">Regenerate</button>'
      : '';
    return '<div class="steps-section">' +
      '<button type="button" class="steps-toggle" data-idx="' + i + '">' +
        (expanded ? '−' : '+') + ' ' + (expanded ? 'Hide' : 'Show') + ' steps (' + doneCount + '/' + steps.length + ' done)' +
      '</button>' + list +
    '</div>';
  }

  function wireStepsControls(id) {
    app.querySelectorAll('.steps-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        state.expandedSteps[idx] = !state.expandedSteps[idx];
        renderDetail();
      });
    });
    app.querySelectorAll('.steps-generate-btn, .steps-regenerate-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        generateSteps(id, Number(btn.getAttribute('data-idx')), btn);
      });
    });
    app.querySelectorAll('.s-done').forEach(function (cb) {
      cb.addEventListener('change', function () {
        toggleStepDone(id, Number(cb.getAttribute('data-idx')), Number(cb.getAttribute('data-step')), cb.checked, cb);
      });
    });
    app.querySelectorAll('.mark-milestone-done-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var cb = app.querySelector('.m-done[data-idx="' + idx + '"]');
        if (cb && !cb.checked) { cb.checked = true; toggleMilestoneDone(id, idx, true, cb); }
      });
    });
  }

  async function toggleStepDone(id, idx, stepIdx, done, cb) {
    cb.disabled = true;
    try {
      var data = await api('/api/projects/' + encodeURIComponent(id) + '/milestones/' + idx + '/steps/' + stepIdx + '/done', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ done: done })
      });
      state.detail.outline.milestones = data.milestones;
      state.expandedSteps[idx] = true;
      renderDetail();
    } catch (e) {
      toast(e.message, true);
      cb.checked = !done;
      cb.disabled = false;
    }
  }

  async function generateSteps(id, idx, btn) {
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Reading the brief…';
    try {
      var data = await api('/api/projects/' + encodeURIComponent(id) + '/milestones/' + idx + '/steps', { method: 'POST' });
      state.detail.outline.milestones = data.milestones;
      state.expandedSteps[idx] = true;
      renderDetail();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  // ---- Check your draft ----

  function bandLabel(b) {
    return b === 'needs_work' ? 'Needs work' : b === 'on_track' ? 'On track' : b === 'strong' ? 'Strong' : b === 'excellent' ? 'Excellent' : b;
  }

  function renderFeedbackSection(d) {
    var submissionFile = d.files.filter(function (f) { return f.purpose === 'submission'; })[0];

    var html = '<h2 class="section-title">Check your draft</h2>' +
      '<p class="hint" style="margin:0 0 12px;">Upload your draft or final document (PDF, up to 8MB) for feedback against the brief, rubric and assessment criteria before you submit it for real. This is a rough guide to help you improve it — not an official mark, and not something to submit instead of asking your tutor.</p>';

    if (d.feedback_status === 'checking') {
      return html + '<div class="progress"><span class="spinner"></span> Reading your draft against the brief and rubric — this can take a minute.</div>';
    }

    html += '<div class="submission-upload">' +
      '<input type="file" id="f-submission" accept="application/pdf">' +
      '<button type="button" class="btn btn-accent" id="uploadCheckBtn">Upload and check</button>' +
    '</div>';

    if (submissionFile) {
      html += '<p class="meta" style="margin:10px 0 0;">Currently checked: ' + esc(submissionFile.filename) + '</p>' +
        '<button type="button" class="btn btn-quiet" id="checkAgainBtn" style="margin:4px 0 0;">' +
        (d.feedback_status === 'ready' ? 'Check again' : 'Check this draft') + '</button>';
    }

    if (d.feedback_status === 'failed') {
      html += '<p class="error-banner">' + esc(d.feedback_error || 'Something went wrong.') + '</p>';
    }

    if (d.feedback_status === 'ready' && d.feedback) {
      html += renderFeedbackResult(d.feedback);
    }

    return html;
  }

  function renderFeedbackResult(f) {
    var checks = f.deliverable_checks.map(function (c) {
      var icon = c.met === 'yes' ? '✓' : c.met === 'no' ? '✗' : '?';
      return '<li class="check-row check-' + esc(c.met) + '"><span class="check-icon">' + icon + '</span>' +
        '<span><strong>' + esc(c.requirement) + '</strong><span class="meta">' + esc(c.note) + '</span></span></li>';
    }).join('');

    var criteria = f.criteria.map(function (c) {
      var strengths = c.strengths.map(function (s) { return '<li class="fb-strength">' + esc(s) + '</li>'; }).join('');
      var gaps = c.gaps.map(function (g) { return '<li class="fb-gap">' + esc(g) + '</li>'; }).join('');
      return '<div class="fb-criterion">' +
        '<div class="fb-criterion-head"><strong>' + esc(c.criterion) + '</strong>' +
        '<span class="band band-' + esc(c.band) + '">' + esc(bandLabel(c.band)) + '</span></div>' +
        (strengths ? '<ul class="plain fb-list">' + strengths + '</ul>' : '') +
        (gaps ? '<ul class="plain fb-list">' + gaps + '</ul>' : '') +
      '</div>';
    }).join('');

    var actions = f.top_actions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');

    return '<div class="feedback-result">' +
      '<div class="fb-overall"><span class="band band-' + esc(f.overall_band) + '">' + esc(bandLabel(f.overall_band)) + '</span>' +
      '<p>' + esc(f.overall_summary) + '</p></div>' +
      '<h3 class="fb-subtitle">Requirements</h3><ul class="plain">' + checks + '</ul>' +
      '<h3 class="fb-subtitle">Against each criterion</h3>' + criteria +
      '<h3 class="fb-subtitle">Before you submit</h3><ol class="steps-list">' + actions + '</ol>' +
    '</div>';
  }

  function wireFeedbackControls(id) {
    var uploadBtn = document.getElementById('uploadCheckBtn');
    if (uploadBtn) uploadBtn.addEventListener('click', function () { uploadAndCheck(id, uploadBtn); });
    var checkAgainBtn = document.getElementById('checkAgainBtn');
    if (checkAgainBtn) checkAgainBtn.addEventListener('click', function () { runCheck(id, checkAgainBtn); });
  }

  async function uploadAndCheck(id, btn) {
    var input = document.getElementById('f-submission');
    var file = input.files[0];
    if (!file) { toast('Choose a PDF first.', true); return; }
    if (file.type !== 'application/pdf') { toast('The document must be a PDF.', true); return; }
    if (file.size > MAX_FILE_BYTES) { toast('That file is larger than 8MB — try a smaller file.', true); return; }

    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    try {
      var fd = new FormData();
      fd.append('submission', file);
      await api('/api/projects/' + encodeURIComponent(id) + '/submission', { method: 'POST', body: fd });
      await runCheck(id, btn);
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function runCheck(id, btn) {
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Checking…';
    state.detail = Object.assign({}, state.detail, { feedback_status: 'checking' });
    renderDetail();
    try {
      await api('/api/projects/' + encodeURIComponent(id) + '/check', { method: 'POST' });
      state.detail = await api('/api/projects/' + encodeURIComponent(id));
      renderDetail();
    } catch (e) {
      toast(e.message, true);
      state.detail = await api('/api/projects/' + encodeURIComponent(id));
      renderDetail();
    }
  }

  function readMilestonesFromForm() {
    return Array.prototype.map.call(document.querySelectorAll('.milestone'), function (el) {
      return {
        title: el.querySelector('.m-title').value,
        goal: el.querySelector('.m-goal').value,
        duration_days: Number(el.querySelector('.m-duration').value)
      };
    });
  }

  function updateScheduleSummary() {
    var d = state.detail;
    var milestones = readMilestonesFromForm();
    var sched = computeScheduleLocal(d.start_date, d.end_date, milestones);
    document.getElementById('scheduleSummary').innerHTML =
      '<span>' + sched.total_days + ' days until the deadline</span>' +
      '<span>' + sched.needed_days + ' days of work planned</span>' +
      '<span>' + sched.usable_days + ' usable once ' + sched.buffer_days + ' days are kept spare</span>';
    document.getElementById('overcommitWarning').innerHTML = sched.overcommitted
      ? '<p class="overcommit-warning">This plan needs about ' + sched.needed_days + ' days of work but there are only about ' +
        sched.usable_days + ' usable before the deadline (' + sched.buffer_days + ' days kept spare at the end). Trim a milestone or two below.</p>'
      : '';
    app.querySelectorAll('.milestone').forEach(function (el, i) {
      el.querySelector('.target').textContent = 'due around ' + formatDateUK(sched.milestones[i].target_date);
    });
  }

  async function saveOutlineEdits(id) {
    var btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var milestones = readMilestonesFromForm();
      for (var i = 0; i < milestones.length; i++) {
        if (!milestones[i].title.trim()) throw new Error('Every milestone needs a title.');
        if (!Number.isFinite(milestones[i].duration_days) || milestones[i].duration_days < 1) throw new Error('Milestone durations must be at least 1 day.');
      }
      state.detail = await api('/api/projects/' + encodeURIComponent(id), {
        method: 'PATCH', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ outline: { milestones: milestones } })
      });
      toast('Saved.');
      render();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; btn.textContent = 'Save changes';
    }
  }

  async function startAnalyzing(id) {
    state.detail = Object.assign({}, state.detail, { status: 'analyzing' });
    render();
    await runAnalyze(id);
  }

  function wireBack() {
    var b = document.getElementById('backBtn');
    if (b) b.addEventListener('click', loadDashboard);
  }

  loadDashboard();
  loadEmail();
})();
</script>
</body>
</html>
